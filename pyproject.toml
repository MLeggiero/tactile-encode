[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "tactile-sim"
version = "0.1.0"
description = "MuJoCo simulation of the tactile + World-Action-Model testbed (Task A: hammer to nail)"
readme = "README.md"
requires-python = ">=3.10"
dependencies = ["mujoco>=3.2,<4", "numpy", "scipy", "h5py"]

[project.optional-dependencies]
gym = ["gymnasium>=1.0"]
dev = ["pytest", "ruff"]
# GPU training (tactile_rl): mjlab on MuJoCo Warp; mjlab 1.6.0 pins MuJoCo / MuJoCo Warp 3.11 (the validator .venv
# keeps MuJoCo 3.14)
rl = ["mjlab==1.6.0", "onnx", "onnxruntime"]

[tool.setuptools.packages.find]
include = ["tactile_sim*", "tactile_rl*"]

[tool.setuptools.package-data]
"tactile_sim.assets" = ["*.xml", "*.json"]
"tactile_sim.viewer" = ["*.html"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
  "network: needs outbound HTTPS to raw.githubusercontent.com",
  "slow: full strike episodes (tens of seconds)",
  "gpu: needs torch, mjlab and a CUDA device (the .venv-rl training env); skipped otherwise",
  "rl: GPU training env tests (tactile_rl)",
]

[tool.ruff]
line-length = 120
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP"]
ignore = ["E741"]
